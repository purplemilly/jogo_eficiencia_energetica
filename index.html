<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio: Eficiência Energética na Indústria</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #f39c12;
            --bg: #ecf0f1;
            --text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--primary);
            color: var(--text);
            overflow: hidden; 
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .active {
            display: flex;
        }

        /* Tela Inicial */
        #start-screen {
            background: linear-gradient(135deg, rgba(44,62,80,0.9), rgba(44,62,80,0.8)), url('image.png') no-repeat center center;
            background-size: cover;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .title-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            border: 2px solid var(--accent);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        p.instructions {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
            background-color: #219653;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        /* Tela do Jogo */
        #game-screen {
            background-color: #111;
            flex-direction: column;
        }

        .header {
            width: 100%;
            height: 60px;
            background-color: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
        }

        .progress { color: var(--accent); font-size: 1.5rem; }

        /* Novo Container para corrigir o alinhamento */
        .game-area {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #interactive-wrapper {
            position: relative;
            display: inline-block;
        }

        #main-img {
            max-width: 100vw;
            max-height: calc(100vh - 60px); /* Subtrai a altura do cabeçalho */
            display: block;
            cursor: crosshair;
        }

        .marker {
            position: absolute;
            border: 4px solid var(--secondary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--secondary), inset 0 0 10px var(--secondary);
            pointer-events: none;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white; padding: 30px; border-radius: 12px;
            max-width: 600px; width: 90%; text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-body { display: flex; flex-direction: column; gap: 20px; text-align: left; margin-bottom: 25px; }
        
        @media(min-width: 600px) {
            .modal-body { flex-direction: row; align-items: flex-start; }
        }

        .modal-image-wrapper {
            flex-shrink: 0; width: 200px; height: 200px; border-radius: 8px;
            border: 3px solid var(--accent); margin: 0 auto;
            background-image: url('image.png'); background-size: 500%; background-repeat: no-repeat;
        }

        .problem-title { color: #c0392b; font-weight: bold; }
        .solution-title { color: var(--secondary); font-weight: bold; }

        /* Tela Final */
        #end-screen { background: var(--bg); padding: 40px; overflow-y: auto; justify-content: flex-start; }
        .end-header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .end-header h1 { color: var(--secondary); font-size: 3rem; margin-bottom: 10px; }
        .motivation {
            font-size: 1.5rem; font-style: italic; color: var(--primary);
            margin-bottom: 20px; padding: 20px; background: white;
            border-left: 5px solid var(--accent); border-radius: 8px;
        }
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; margin-bottom: 40px;
        }
        .summary-card { background: white; padding: 20px; border-radius: 10px; border-top: 4px solid var(--primary); }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="title-box">
            <h1>Desafio: Eficiência Energética</h1>
            <p class="instructions">Sua missão é inspecionar o ambiente e clicar nos <strong>6 locais</strong> onde há desperdício de energia.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome..." autocomplete="off">
            <button id="btn-start" disabled>JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <div id="player-display">Operador: <span></span></div>
            <div>Oportunidades: <span class="progress"><span id="found-count">0</span> / 6</span></div>
        </div>
        <div class="game-area">
            <!-- Camada interativa que resolve o problema de alinhamento -->
            <div id="interactive-wrapper">
                <img src="image.png" id="main-img" alt="Ambiente">
            </div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Oportunidade!</h2>
            <div class="modal-body">
                <div class="modal-image-wrapper" id="modal-img-wrapper"></div>
                <div class="modal-text">
                    <p><span class="problem-title">Problema:</span> <span id="modal-problem"></span></p>
                    <p><span class="solution-title">Solução:</span> <span id="modal-solution"></span></p>
                </div>
            </div>
            <button id="btn-continue">Continuar</button>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <div class="end-header">
            <h1>Parabéns, <span id="end-player-name"></span>!</h1>
        </div>
        <div class="motivation">"A eficiência energética otimiza recursos e constrói uma indústria sustentável."</div>
        <div class="summary-grid" id="summary-grid"></div>
        <button onclick="location.reload()">Jogar Novamente</button>
    </div>

    <script>
        // Aumentamos consideravelmente o valor de 'r' (raio de clique) para cobrir os objetos inteiros.
        const hotspots = [
            { id: 1, title: "Vazamento de Ar Comprimido", x: 21, y: 28, r: 12, problem: "Vapor/ar escapando da tubulação amarela.", solution: "Manutenção preventiva e troca de vedações.", bgPos: "15% 25%" },
            { id: 2, title: "Ar-Condicionado Acima do Forno", x: 69, y: 14, r: 12, problem: "Ar condicionado sobre fonte extrema de calor.", solution: "Reposicionar o aparelho.", bgPos: "75% 8%" },
            { id: 3, title: "Exaustor Obstruído", x: 91, y: 22, r: 12, problem: "Ventilação bloqueada por caixas.", solution: "Desobstruir a área.", bgPos: "100% 15%" },
            { id: 4, title: "Iluminação Desnecessária", x: 42, y: 8, r: 15, problem: "Lâmpadas acesas em áreas ociosas.", solution: "Instalar sensores de presença.", bgPos: "40% 5%" },
            { id: 5, title: "Painel Elétrico sem Isolamento", x: 89, y: 47, r: 12, problem: "Conexões expostas e pontos quentes.", solution: "Organizar cabeamento e vedar painel.", bgPos: "100% 50%" },
            { id: 6, title: "Porta de Carga Aberta", x: 57, y: 27, r: 14, problem: "Entrada de calor externo sobrecarregando a climatização.", solution: "Instalar cortinas de ar.", bgPos: "58% 25%" }
        ];

        let foundItems = [];
        const interactiveWrapper = document.getElementById('interactive-wrapper');
        const mainImg = document.getElementById('main-img');

        document.getElementById('player-name').addEventListener('input', (e) => {
            document.getElementById('btn-start').disabled = e.target.value.trim().length < 2;
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            const name = document.getElementById('player-name').value;
            document.querySelector('#player-display span').innerText = name;
            document.getElementById('end-player-name').innerText = name;
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        });

        // O clique agora é registrado no wrapper, que tem o exato tamanho da imagem
        interactiveWrapper.addEventListener('click', (e) => {
            const rect = interactiveWrapper.getBoundingClientRect();
            // Calcula as coordenadas em % estritamente em cima da imagem renderizada
            const clickX = ((e.clientX - rect.left) / rect.width) * 100;
            const clickY = ((e.clientY - rect.top) / rect.height) * 100;

            for (let point of hotspots) {
                if (foundItems.includes(point.id)) continue;
                
                // Distância simples em percentual
                const ratio = rect.width / rect.height;
                const dx = (clickX - point.x) * ratio; 
                const dy = (clickY - point.y);
                const distance = Math.sqrt(dx*dx + dy*dy);

                if (distance <= point.r) {
                    foundItems.push(point.id);
                    
                    const marker = document.createElement('div');
                    marker.className = 'marker';
                    marker.style.left = point.x + '%';
                    marker.style.top = point.y + '%';
                    
                    // Tamanho do marcador adaptativo
                    const markerSize = Math.max(50, rect.width * (point.r * 2 / 100) * 0.5); 
                    marker.style.width = markerSize + 'px';
                    marker.style.height = markerSize + 'px';
                    
                    interactiveWrapper.appendChild(marker);
                    document.getElementById('found-count').innerText = foundItems.length;
                    
                    showModal(point);
                    return;
                }
            }
        });

        function showModal(point) {
            document.getElementById('modal-title').innerText = point.title;
            document.getElementById('modal-problem').innerText = point.problem;
            document.getElementById('modal-solution').innerText = point.solution;
            document.getElementById('modal-img-wrapper').style.backgroundPosition = point.bgPos;
            document.getElementById('modal').classList.add('active');
        }

        document.getElementById('btn-continue').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
            if (foundItems.length === hotspots.length) {
                setTimeout(() => {
                    document.getElementById('game-screen').classList.remove('active');
                    document.getElementById('end-screen').classList.add('active');
                    
                    const grid = document.getElementById('summary-grid');
                    hotspots.forEach(pt => {
                        grid.innerHTML += `<div class="summary-card"><h3>${pt.title}</h3><p><strong>Problema:</strong> ${pt.problem}</p><p><strong>Solução:</strong> ${pt.solution}</p></div>`;
                    });
                }, 500);
            }
        });
    </script>
</body>
</html>
